<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IY - Personal AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       LANDING PAGE
  ========================== -->

  <nav class="navbar">

    <div class="logo">
      IY
    </div>

    <button class="login-btn" onclick="openAuth()">
      LOGIN
    </button>

  </nav>


  <main class="hero">

    <div class="ai-circle">
      IY
    </div>

    <h1>
      Your Personal AI
    </h1>

    <p class="subtitle">
      Meet IY — your personal AI assistant.
      IY will learn your preferences and help you
      with your everyday tasks.
    </p>

    <button class="start-btn" onclick="openAuth()">
      GET STARTED
    </button>

  </main>



  <!-- =========================
       LOGIN / SIGNUP
  ========================== -->

  <div class="login-box" id="authBox">

    <div class="auth-card">

      <h2>
        Welcome to IY
      </h2>

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button
        class="signup-btn"
        onclick="signUp()"
      >
        CREATE ACCOUNT
      </button>

      <button
        class="login-submit"
        onclick="signIn()"
      >
        LOGIN
      </button>

      <button
        class="close-btn"
        onclick="closeAuth()"
      >
        CLOSE
      </button>

      <p id="message"></p>

    </div>

  </div>



  <!-- =========================
       DASHBOARD
  ========================== -->

 <!-- =========================
     DASHBOARD
========================= -->

<div id="dashboard">

  <div class="dashboard-header">

    <div class="logo">
      IY
    </div>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>


  <div class="dashboard-layout">

    <!-- =========================
         CHAT SIDEBAR
    ========================== -->

    <aside class="chat-sidebar">

      <button
        class="new-chat-btn"
        onclick="createNewChat()"
      >
        + NEW CHAT
      </button>

      <h3>CHAT HISTORY</h3>

      <div id="chatList">
        <!-- Chats will appear here -->
      </div>

      <div class="memory-section">

        <button
          class="memory-btn"
          onclick="showMemory()"
        >
          🧠 PERSONAL MEMORY
        </button>

      </div>

    </aside>


    <!-- =========================
         MAIN CHAT
    ========================== -->

    

    
    <main class="chat-main">

      <div class="dashboard-welcome">

        <h1 id="chatTitle">
           Welcome to IY
        </h1>

        <p>
          Your personal AI assistant is ready.
        </p>

      </div>


      <div class="chat-box">

        <div id="chatMessages">

          <div class="ai-message">
            Hello! I'm IY. How can I help you?
          </div>

        </div>


        <div class="chat-input">

          <input
            type="text"
            id="chatInput"
            placeholder="Ask IY anything..."
            onkeydown="handleChatKey(event)"
          >

          <button onclick="sendMessage()">
            SEND
          </button>

        </div>

      </div>

    </main>

  </div>

</div>


    <div class="dashboard-content">




      <!-- CHAT -->

      



  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- IY JAVASCRIPT -->

  <script src="script.js"></script>

</body>

</html>
