<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IY - Personal AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080808;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .login-btn {
            padding: 11px 22px;
            border: 1px solid #444;
            border-radius: 8px;
            background: white;
            color: black;
            cursor: pointer;
            font-weight: bold;
        }

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .ai-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #444;
            box-shadow: 0 0 40px rgba(255,255,255,0.08);
            margin-bottom: 30px;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #aaa;
            font-size: 18px;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .start-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 9px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-btn:hover,
        .login-btn:hover {
            opacity: 0.85;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0 20px;
            }

            h1 {
                font-size: 40px;
            }

            .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">IY</div>

        <button class="login-btn">
            LOGIN
        </button>
    </nav>

    <main class="hero">

        <div class="ai-circle">
            IY
        </div>

        <h1>Your Personal AI</h1>

        <p class="subtitle">
            Meet IY — an intelligent personal AI assistant
            designed to understand you, remember your preferences,
            and help you with your everyday tasks.
        </p>

        <button class="start-btn">
            GET STARTED
        </button>

    </main>

</body>
</html>
